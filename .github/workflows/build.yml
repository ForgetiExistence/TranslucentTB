name: Build TranslucentTB

on:
  push:
    branches: [ release, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [x64]
        configuration: [Release]

    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Integrate vcpkg
      run: vcpkg integrate install

    - name: Restore NuGet packages
      run: nuget restore TranslucentTB.slnx

    - name: Build solution
      run: msbuild TranslucentTB.slnx /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

    - name: Create portable package
      shell: pwsh
      run: |
        $platform = "${{ matrix.platform }}"
        $configuration = "${{ matrix.configuration }}"
        New-Item -Path "portable" -ItemType Directory -Force
        Copy-Item -Path "AppPackage\bin\$platform\$configuration\*" -Destination "portable" -Recurse -Include @("*.exe", "*.dll", "resources.pri", "Assets")
        Compress-Archive -Path "portable\*" -DestinationPath "TranslucentTB-portable-$($platform.ToLower()).zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TranslucentTB-portable-${{ matrix.platform }}
        path: TranslucentTB-portable-${{ matrix.platform }}.zip
        retention-days: 90
